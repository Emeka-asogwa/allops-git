name: CICD
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
permissions:
  contents: read
  pull-requests: write
  actions: write

jobs:
  Build-Deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "14"
      - name: Install dependence
        run: npm install
      - name: Run tests
        run: npm test
      - name: Deploy to production
        if: github.ref == 'refs/heads/main' && success()
        run: npm run deploy
